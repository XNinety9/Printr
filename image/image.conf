# Service drop-in for the Raspberry Pi image: listen on port 80 (the only privilege granted), so
# the app answers on http://printr.local and as the hotspot's captive portal; /run/printr holds
# the hotspot's hostapd configuration.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
RuntimeDirectory=printr
RuntimeDirectoryMode=0750
