name: Release

# Compile printr pour les Raspberry Pi et les PC Linux, et attache les archives à la release
# GitHub de l'étiquette (créée au besoin, avec la section du CHANGELOG comme notes).
#   - à chaque étiquette vX.Y.Z poussée ;
#   - à la main pour une ancienne étiquette : gh workflow run release.yml -f tag=v1.4.0
# Chaque archive contient le binaire et les fichiers d'installation : décompresser, puis
# `sudo bash install.sh`. SHA256SUMS permet de vérifier ce qu'on a téléchargé. S'y ajoute l'image
# prête à flasher pour Raspberry Pi (voir image/README.md).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à compiler (ex. v1.4.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Compilation ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu     # Pi 3, 4, 5, Zero 2 W (64 bits)
          - armv7-unknown-linux-gnueabihf # Pi 2, Pi 3 en 32 bits
          - arm-unknown-linux-gnueabihf   # Pi Zero W, Pi 1 (ARMv6)
          - x86_64-unknown-linux-gnu      # PC, serveur
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # Licence et NOTICE de la branche principale : les versions publiées avant l'ajout de la
      # licence Apache 2.0 sont distribuées sous la même licence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _main
          sparse-checkout: |
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      # cross compile dans une image à glibc ancienne : le binaire tourne sur un Raspberry Pi OS
      # de quelques années, comme avec scripts/deploy.sh.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Archive
        run: |
          name="printr-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/printr" "dist/$name/"
          cp deploy/* "dist/$name/"
          for f in README.md README.fr.md docs/guide.md docs/guide.fr.md CHANGELOG.md; do [ -f "$f" ] && cp "$f" "dist/$name/"; done
          cp _main/LICENSE _main/NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Binaire seul, pour la mise à jour automatique : printr-<architecture de Rust>. Le
          # binaire ARM 32 bits vise ARMv6, et tourne donc aussi en ARMv7.
          case "${{ matrix.target }}" in
            aarch64-*) cp "target/${{ matrix.target }}/release/printr" dist/printr-aarch64 ;;
            arm-*) cp "target/${{ matrix.target }}/release/printr" dist/printr-arm ;;
            x86_64-*) cp "target/${{ matrix.target }}/release/printr" dist/printr-x86_64 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/printr-aarch64
            dist/printr-arm
            dist/printr-x86_64

  release:
    name: Publication
    needs: build
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        # Signée ensuite sur le PC du mainteneur (scripts/signer-release.sh) : SHA256SUMS.minisig.
        run: cd dist && sha256sum *.tar.gz printr-aarch64 printr-arm printr-x86_64 > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Notes : la section de la version dans le CHANGELOG.
            version="${TAG#v}"
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            # Titre : « Printr 1.7.0 “Hoe” », le nom de code venant du titre de la section.
            name=$(grep -m1 "^## \[$version\]" CHANGELOG.md | sed -n 's/.*“\(.*\)”.*/\1/p')
            gh release create "$TAG" --verify-tag --title "Printr $version${name:+ “$name”}" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/printr-aarch64 dist/printr-arm dist/printr-x86_64 dist/SHA256SUMS --clobber

  image:
    name: Image Raspberry Pi
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
