name: CI

# Vérifie chaque pull request et chaque push sur master : formatage, clippy, tests, appli web,
# scripts shell et dépendances (failles, licences). Une PR rouge ne se fusionne pas.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (formatage, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # node --check ne voit que la syntaxe : l'appli doit aussi démarrer pour de bon (une constante
      # utilisée avant sa déclaration l'arrête au chargement, sans erreur de syntaxe).
      - name: L'appli démarre dans un navigateur
        run: |
          cargo build --locked
          PRINTR_DATA_DIR=$(mktemp -d) target/debug/printr --dump /dev/null serve --listen 127.0.0.1:8099 &
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.2; done
          google-chrome --headless=new --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8099/ > dom.html
          grep -q 'class="login-card"' dom.html || { echo "l'appli ne s'affiche pas :"; head -c 3000 dom.html; exit 1; }

  web:
    name: Appli web et scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntaxe de l'appli
        run: node --check web/app.js
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  deps:
    name: Dépendances (failles, licences, provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  workflows:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Audit de sécurité des workflows : injections, permissions, actions non épinglées.
      - run: pipx run zizmor==1.30.1 --format=github .github/workflows
