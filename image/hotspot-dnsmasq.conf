# DHCP and DNS on Printr's hotspot: every name leads to Printr, so phones open the setup page by
# themselves (captive portal).
interface=wlan0
bind-dynamic
no-resolv
no-hosts
address=/#/10.42.0.1
dhcp-range=10.42.0.10,10.42.0.254,255.255.255.0,1h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# No RFC 8910 option (114): it must point to an HTTPS JSON API; given the page itself, iPhones stop
# probing captive.apple.com and never show the portal.
dhcp-authoritative
user=nobody
group=nogroup
