[package]
name = "printr"
version = "2.0.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
crosswords = { git = "https://github.com/XNinety9/CrossWords", tag = "v1.1.0", version = "1.1.0" }
escpos = { version = "0.20.0", features = ["graphics"] }
feed-rs = "3.0.0"
image = "0.25"
libc = "0.2"
minisign-verify = "0.3"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
rpassword = "7.5.4"
rrule = "0.14.0"
rss = "2.1.2"
rumqttc = { package = "rumqttc-v4-next", version = "0.34.0", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sgp4 = "2.4.0"
sha2 = "0.11"
terminal_size = "0.4.4"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", features = ["json"] }
webpki-roots = "1"

[dev-dependencies]
minisign = "0.10"
